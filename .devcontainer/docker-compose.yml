
version: '3.8'

services:
  # The backend API service
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile # Change to your actual subfolder name
    ports:
      - "7860:7860"
    # Overrides the command to keep the container alive if needed
    command: /bin/sh -c "while sleep 1000; do :; done" 

  # The frontend UI service
  ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile # Change to your actual subfolder name
    ports:
      - "8501:8501" # Change to your UI's local port
    depends_on:
      - api
    command: /bin/sh -c "while sleep 1000; do :; done"

